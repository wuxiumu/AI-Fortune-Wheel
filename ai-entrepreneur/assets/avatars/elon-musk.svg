<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <!-- 背景渐变 -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a1f4e"/>
      <stop offset="100%" style="stop-color:#0a0e27"/>
    </radialGradient>

    <!-- 头像渐变 -->
    <linearGradient id="avatarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>

    <!-- 光晕效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <circle cx="200" cy="200" r="200" fill="url(#bgGradient)"/>

  <!-- 星空点缀 -->
  <circle cx="80" cy="100" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="320" cy="80" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="150" cy="320" r="1.5" fill="#fff" opacity="0.7"/>
  <circle cx="280" cy="280" r="2" fill="#fff" opacity="0.5"/>
  <circle cx="100" cy="250" r="1" fill="#fff" opacity="0.6"/>

  <!-- 人物轮廓（简化版 Elon Musk） -->
  <g id="person" transform="translate(200, 200)">
    <!-- 头部 -->
    <ellipse cx="0" cy="-60" rx="55" ry="65" fill="#f5d0c5"/>

    <!-- 头发 -->
    <path d="M -55 -80 Q -50 -130 0 -130 Q 50 -130 55 -80 Q 55 -100 45 -110 Q 30 -125 0 -125 Q -30 -125 -45 -110 Q -55 -100 -55 -80 Z" fill="#4a3728"/>

    <!-- 耳朵 -->
    <ellipse cx="-50" cy="-60" rx="8" ry="15" fill="#e8b8a8"/>
    <ellipse cx="50" cy="-60" rx="8" ry="15" fill="#e8b8a8"/>

    <!-- 眼睛 -->
    <ellipse cx="-20" cy="-65" rx="8" ry="5" fill="#fff"/>
    <ellipse cx="20" cy="-65" rx="8" ry="5" fill="#fff"/>
    <circle cx="-20" cy="-65" r="3" fill="#4a3728"/>
    <circle cx="20" cy="-65" r="3" fill="#4a3728"/>

    <!-- 眉毛 -->
    <path d="M -30 -75 Q -20 -78 -10 -75" stroke="#4a3728" stroke-width="3" fill="none"/>
    <path d="M 10 -75 Q 20 -78 30 -75" stroke="#4a3728" stroke-width="3" fill="none"/>

    <!-- 鼻子 -->
    <path d="M 0 -65 L -5 -45 L 5 -45 Z" fill="#e8b8a8"/>

    <!-- 嘴巴 -->
    <path d="M -15 -30 Q 0 -25 15 -30" stroke="#c48b7f" stroke-width="2" fill="none"/>

    <!-- 胡须（Elon Musk 特征） -->
    <path d="M -25 -20 Q 0 -15 25 -20 Q 20 -10 0 -5 Q -20 -10 -25 -20 Z" fill="#4a3728" opacity="0.3"/>

    <!-- 颈部 -->
    <rect x="-25" y="0" width="50" height="30" fill="#f5d0c5"/>

    <!-- 衣服（黑色 T 恤） -->
    <path d="M -80 30 Q -80 20 -60 20 L 60 20 Q 80 20 80 30 L 80 120 L -80 120 Z" fill="#1a1a1a"/>

    <!-- 衣领 -->
    <path d="M -30 20 L 0 35 L 30 20 L 30 25 L 0 40 L -30 25 Z" fill="#2a2a2a"/>
  </g>

  <!-- 光环效果 -->
  <circle cx="200" cy="200" r="195" fill="none" stroke="url(#avatarGradient)" stroke-width="2" opacity="0.5" filter="url(#glow)"/>

  <!-- 外圈装饰 -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="rgba(96, 165, 250, 0.3)" stroke-width="1" stroke-dasharray="5 5"/>
</svg>
